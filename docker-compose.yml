services:
  db:
    image: postgres:17
    container_name: lotm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: passwordlotm1234
      POSTGRES_DB: lotm
    ports:
      - "5433:5432"
    volumes:
      - lotm_db_data:/var/lib/postgresql/data
      - ./Database/LOTM_DB_Schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./Database/seed.sql:/docker-entrypoint-initdb.d/seed.sql
      - ./Database/chapters.csv:/docker-entrypoint-initdb.d/chapters.csv
      - ./Database/volumes.csv:/docker-entrypoint-initdb.d/volumes.csv

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lotm_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-passwordlotm1234}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-lotm}
    depends_on:
      - db

  pgadmin:
    image: dpage/pgadmin4
    container_name: lotm_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lotm.com
      PGADMIN_DEFAULT_PASSWORD: passwordlotm1234
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  lotm_db_data:
